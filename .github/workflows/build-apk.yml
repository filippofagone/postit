name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["app/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepara la parte web
        run: cd app && npm ci && npx cap copy android
      - name: Compila l'APK
        run: |
          cd app/android && chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
      - name: Salva il log se fallisce
        if: failure()
        run: |
          cp /tmp/build.log build-error.log
          git config user.name "postit-bot"
          git config user.email "postit-bot@users.noreply.github.com"
          git add build-error.log
          git commit -m "log errore compilazione"
          git push
      - name: Pubblica APK nelle Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Post-It APK · build ${{ github.run_number }}"
          body: "APK dell'app nativa Post-It, generato automaticamente."
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
