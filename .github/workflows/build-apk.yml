name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["app/**", ".github/workflows/build-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepara la parte web
        run: cd app && npm ci && npx cap copy android
      - name: Compila l'APK
        run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: postit-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
