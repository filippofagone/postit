      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sora:wght@400;500;600;700&display=swap');

      * { box-sizing: border-box; margin: 0; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      .app {
        font-family: 'Sora', system-ui, sans-serif;
        color: ${Qg()};
        min-height: 100vh;
        background: #ECEEF3;
        background-image: radial-gradient(#d4d8e2 1px, transparent 1.2px);
        background-size: 22px 22px;
        display: flex; flex-direction: column;
        overflow-x: hidden;
      }
      button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid #5B8DEF; outline-offset: 2px; border-radius: 6px; }

      .loading { margin: auto; font-size: 20px; }

      /* \u2500\u2500\u2500\u2500\u2500 login \u2500\u2500\u2500\u2500\u2500 */
      .login { align-items: center; justify-content: center; }
      .loginBox { text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 40px) 20px 40px; max-width: 560px; margin: auto; }
      .logo { font-family: 'Caveat', cursive; font-size: 64px; font-weight: 700; letter-spacing: 1px; }
      .logoDot { color: #F48FB1; }
      .loginSub { margin: 6px 0 28px; opacity: .75; }
      .loginGrid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
      .userCard {
        width: 128px; height: 128px; border-radius: 4px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        box-shadow: 0 10px 18px -8px rgba(40,40,70,.45);
        transition: transform .15s, box-shadow .15s;
      }
      .userCard:hover { transform: rotate(0deg) scale(1.06) !important; box-shadow: 0 16px 26px -10px rgba(40,40,70,.5); }
      .uEmoji { font-size: 34px; }
      .uName { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 600; }
      .uRole { font-size: 10px; opacity: .65; }

      /* \u2500\u2500\u2500\u2500\u2500 header \u2500\u2500\u2500\u2500\u2500 */
      .hdr {
        position: sticky; top: 0; z-index: 200;
        display: flex; align-items: center; gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
        background: rgba(236,238,243,.88); backdrop-filter: blur(8px);
        border-bottom: 1px solid #d9dce6;
      }
      .logoSm { font-size: 30px; line-height: 1; }
      .tabs { display: flex; gap: 6px; margin: 0 auto; }
      .tabBtn { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; opacity: .6; }
      .tabBtn.on { background: #2A2620; color: #FFF9E8; opacity: 1; }
      .hdrRight { display: flex; align-items: center; gap: 8px; }
      .bell { position: relative; font-size: 20px; padding: 4px; }
      .badge {
        position: absolute; top: -4px; right: -6px;
        background: #E53E51; color: #fff; font-size: 10px; font-weight: 700;
        min-width: 17px; height: 17px; border-radius: 999px;
        display: flex; align-items: center; justify-content: center; padding: 0 4px;
      }
      .avatar { font-size: 20px; width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); }

      /* \u2500\u2500\u2500\u2500\u2500 notifiche \u2500\u2500\u2500\u2500\u2500 */
      .bellPanel {
        position: fixed; top: calc(env(safe-area-inset-top, 0px) + 70px); right: 12px; z-index: 300;
        width: min(92vw, 360px); max-height: 60vh; overflow-y: auto;
        background: #fff; border-radius: 14px; box-shadow: 0 20px 40px -12px rgba(30,30,60,.35);
        padding: 12px;
      }
      .bellHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .x { font-size: 14px; opacity: .6; padding: 4px 8px; }
      .notif {
        display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
        width: 100%; text-align: left; font-size: 13px;
        background: #FFF6C9; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
      }
      .notif.avviso { background: #E4EEFF; }
      .notif.read { background: #F2F3F6; opacity: .7; }
      .notifCta { font-weight: 700; font-size: 12px; color: #B0662A; }
      .notifOk { font-size: 11px; color: #2E7D32; font-weight: 600; }

      /* \u2500\u2500\u2500\u2500\u2500 filtri \u2500\u2500\u2500\u2500\u2500 */
      .chips { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
      .chip { padding: 6px 14px; border-radius: 999px; background: #fff; font-size: 12px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); opacity: .65; }
      .chip.on { background: #2A2620; color: #FFF9E8; opacity: 1; }
      .count { margin-left: auto; font-size: 11px; opacity: .5; }

      /* \u2500\u2500\u2500\u2500\u2500 caroselli \u2500\u2500\u2500\u2500\u2500 */
      .board { flex: 1; display: flex; min-height: 0; }
      .car { flex: 1; display: flex; scrollbar-width: none; }
      .car::-webkit-scrollbar { display: none; }
      .car-v {
        flex-direction: column; align-items: center;
        overflow-y: auto; overflow-x: hidden;
        height: calc(100vh - 128px);
        scroll-snap-type: y mandatory;
        padding: 26vh 12px;
        gap: 22px;
      }
      .car-h {
        flex-direction: row; align-items: center;
        overflow-x: auto; overflow-y: hidden;
        height: calc(100vh - 128px);
        scroll-snap-type: x mandatory;
        padding: 0 calc(50% - min(31vw, 150px));
        gap: 18px;
      }
      .snap { scroll-snap-align: center; flex-shrink: 0; transition: transform .12s linear, opacity .12s linear; will-change: transform, opacity; }
      @media (prefers-reduced-motion: reduce) { .snap, .userCard { transition: none; } }

      /* \u2500\u2500\u2500\u2500\u2500 post-it \u2500\u2500\u2500\u2500\u2500 */
      .postit {
        position: relative;
        width: min(80vw, 330px);
        min-height: 210px;
        padding: 26px 18px 34px;
        border-radius: 3px;
        box-shadow: 0 14px 26px -10px rgba(40,40,70,.42), inset 0 -32px 30px -30px rgba(120,90,0,.18);
        display: flex; flex-direction: column; gap: 10px;
      }
      .postit.done { filter: saturate(.55) brightness(1.02); }
      .idea.postit { width: min(62vw, 300px); }
      .tape {
        position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(-2deg);
        width: 92px; height: 26px;
        background: rgba(255,255,255,.55);
        box-shadow: 0 2px 4px rgba(0,0,0,.10);
        border-left: 1px dashed rgba(0,0,0,.08); border-right: 1px dashed rgba(0,0,0,.08);
      }
      .fold {
        position: absolute; right: 0; bottom: 0; width: 28px; height: 28px;
        --cut: #ECEEF3;
        background: linear-gradient(to top left,
          var(--cut) 0%, var(--cut) 49%,
          rgba(0,0,0,.20) 50%,
          rgba(0,0,0,.06) 100%);
      }
      .modal .fold { --cut: #F7F6F2; }
      .piTop { display: flex; gap: 6px; flex-wrap: wrap; min-height: 4px; align-items: center; }
      .del { margin-left: auto; font-size: 14px; line-height: 1; background: rgba(255,255,255,.55); border-radius: 999px; padding: 5px 9px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .del.sure { font-size: 11px; font-weight: 700; background: #C62838; color: #fff; animation: delPulse .25s ease; }
      @keyframes delPulse { from { scale: .8; } to { scale: 1; } }
      .prio { font-size: 11px; font-weight: 700; background: rgba(255,255,255,.55); border-radius: 999px; padding: 3px 9px; }
      .stBadge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: rgba(255,255,255,.6); }
      .stBadge.fine { background: #2A2620; color: #FFF9E8; }
      .stBadge.approvato { background: #C9F2CE; }
      .stBadge.sviluppo { background: #CFE3FF; }
      .stBadge.scartato { background: #F3D2D2; }
      .piText { font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.15; font-weight: 600; overflow-wrap: anywhere; }
      .piMeta { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
      .per b { font-weight: 600; }
      .piActions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .mini { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.65); border-radius: 999px; padding: 6px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .mini.solid { background: #2A2620; color: #FFF9E8; }
      .okTag { font-size: 11px; font-weight: 700; color: #1d5e26; }
      .da { position: absolute; left: 12px; bottom: 8px; font-size: 11px; font-weight: 600; opacity: .65; }

      /* \u2500\u2500\u2500\u2500\u2500 like bar \u2500\u2500\u2500\u2500\u2500 */
      .likeBar { position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .lk {
        display: flex; align-items: center; gap: 5px;
        font-size: 15px; background: rgba(255,255,255,.65);
        border-radius: 999px; padding: 6px 12px;
        box-shadow: 0 1px 3px rgba(0,0,0,.1);
        touch-action: none; user-select: none;
      }
      .lk b { font-size: 13px; }
      .lk.on { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
      .pop {
        position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 50;
        background: #2A2620; color: #FFF9E8;
        border-radius: 10px; padding: 8px 12px; font-size: 12px;
        display: flex; flex-direction: column; gap: 3px;
        box-shadow: 0 10px 22px -8px rgba(0,0,0,.5);
        max-width: 240px;
      }
      .motiv { font-size: 12.5px; background: rgba(255,255,255,.55); border-radius: 10px; padding: 8px 10px; }
      .motivEdit { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .motivEdit textarea { font-family: inherit; font-size: 13px; border-radius: 8px; border: 1px solid rgba(0,0,0,.15); padding: 8px; width: 100%; }
      .linkBtn { font-size: 12px; margin-left: 6px; }
      .seg { display: flex; gap: 5px; flex-wrap: wrap; }
      .segBtn { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 6px 10px; background: rgba(255,255,255,.5); }
      .segBtn.on { background: #2A2620; color: #FFF9E8; }

      /* \u2500\u2500\u2500\u2500\u2500 FAB \u2500\u2500\u2500\u2500\u2500 */
      .fab {
        position: fixed; right: 18px; bottom: 20px; z-index: 250;
        width: 60px; height: 60px; border-radius: 18px;
        background: #2A2620; color: #FFF9E8; font-size: 30px; line-height: 0;
        box-shadow: 0 14px 24px -8px rgba(0,0,0,.45);
        transition: transform .12s;
