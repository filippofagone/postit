      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Dancing+Script:wght@700&family=Sora:wght@400;500;600;700&display=swap');

      * { box-sizing: border-box; margin: 0; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      .app {
        font-family: 'Sora', system-ui, sans-serif;
        color: ${Fg()};
        min-height: 100vh;
        background: #ECEEF3;
        background-image: radial-gradient(#d4d8e2 1px, transparent 1.2px);
        background-size: 22px 22px;
        display: flex; flex-direction: column;
        overflow-x: hidden;
      }
      button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid #5B8DEF; outline-offset: 2px; border-radius: 6px; }

      .logoDot { color: #F48FB1; }
      .loginSub { margin: 6px 0 28px; opacity: .75; }
      .loginGrid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
      .userCard {
        width: 128px; height: 128px; border-radius: 4px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        box-shadow: 0 10px 18px -8px rgba(40,40,70,.45);
        transition: transform .15s, box-shadow .15s;
      }
      .userCard:hover { transform: rotate(0deg) scale(1.06) !important; box-shadow: 0 16px 26px -10px rgba(40,40,70,.5); }

      /* \u2500\u2500\u2500\u2500\u2500 animazioni su schermo nero (crea/elimina) \u2500\u2500\u2500\u2500\u2500 */
      .fx {

        display: flex; align-items: center; justify-content: center;
        pointer-events: none;
        animation: fxWrap 2.3s ease both;
      }
      @keyframes fxWrap { 0% { opacity: 0; } 8% { opacity: 1; } 86% { opacity: 1; } 100% { opacity: 0; } }
      .fxBox { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .fxStage { position: relative; width: 150px; height: 120px; display: flex; align-items: center; justify-content: center; }
      .fxStage.tall { height: 215px; align-items: flex-start; }
      .fxTxt {
        font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700;

      }
      @keyframes fxTxtIn { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }

      .fxBellWrap { position: relative; display: inline-block; transform-origin: top center; animation: fxBellIn .35s ease both, fxBellRing .95s ease .6s both; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); }
      @keyframes fxBellIn { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
      @keyframes fxBellRing { 0%, 100% { rotate: 0deg; } 15% { rotate: 22deg; } 35% { rotate: -18deg; } 55% { rotate: 11deg; } 75% { rotate: -5deg; } }
      .fxPin2 { position: absolute; top: -20px; left: 50%; margin-left: 6px; animation: fxPinDrop .3s cubic-bezier(.55,0,1,.45) .3s both; filter: drop-shadow(0 5px 5px rgba(0,0,0,.35)); }
      @keyframes fxPinDrop { from { opacity: 0; translate: 46px -110px; rotate: 16deg; } to { opacity: 1; translate: 0 0; rotate: 0deg; } }
      .fxWave { position: absolute; top: 24px; width: 28px; height: 48px; border: 4px solid #FFF9E8; border-radius: 50%; border-color: transparent #FFF9E8 transparent transparent; opacity: 0; }
      .fxWave.wr { right: -30px; animation: waveOut .55s ease .62s 2; }
      .fxWave.wl { left: -30px; rotate: 180deg; animation: waveOut .55s ease .62s 2; }
      @keyframes waveOut { 0% { opacity: 0; scale: .5; } 30% { opacity: 1; } 100% { opacity: 0; scale: 1.3; } }

      .bulbStage { height: 170px; }
      .fxBulbWrap { display: inline-block; animation: fxFlicker 2s both; filter: drop-shadow(0 8px 12px rgba(0,0,0,.3)); }
      .fxHalo {
        position: absolute; top: 62px; left: 50%; translate: -50% -50%;
        width: 195px; height: 195px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,213,79,.6), rgba(255,213,79,0) 70%);
        filter: blur(6px); opacity: 0;
        animation: haloOn .6s ease 1.1s both;
      }
      @keyframes haloOn { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }
      .fxRay { position: absolute; top: 62px; left: 50%; width: 6px; height: 18px; margin: -9px 0 0 -3px; border-radius: 3px; background: #FFE082; opacity: 0; animation: rayPop .4s ease both; }
      @keyframes rayPop { 0% { opacity: 0; scale: .2; } 60% { opacity: 1; scale: 1.2; } 100% { opacity: 1; scale: 1; } }

      @keyframes fxFlicker {
        0% { opacity: .25; filter: brightness(.6); }
        8% { opacity: 1; filter: brightness(1.1); }
        12% { opacity: .3; filter: brightness(.6); }
        22% { opacity: 1; }
        26% { opacity: .35; filter: brightness(.6); }
        38% { opacity: 1; }
        43% { opacity: .4; filter: brightness(.7); }
        55% { opacity: 1; filter: brightness(1); }
        70%, 100% { opacity: 1; filter: brightness(1.25) drop-shadow(0 0 26px rgba(255,213,79,.95)) drop-shadow(0 0 60px rgba(255,213,79,.5)); }
      }

      .fxPaper {
        position: absolute; top: 0; left: 50%; margin-left: -45px;
        width: 90px; height: 90px;
        box-shadow: 0 10px 18px -8px rgba(0,0,0,.5);
        animation: fxCrumple .75s ease-in both;
      }
      .fxPaper::before {
        content: ""; position: absolute; inset: 16px 12px;
        background: repeating-linear-gradient(to bottom, rgba(42,38,32,.35) 0 3px, transparent 3px 14px);
        opacity: .8;
      }
      .fxPaper::after {
        content: ""; position: absolute; inset: 0; opacity: 0;
        background:
          linear-gradient(115deg, transparent 40%, rgba(0,0,0,.18) 41% 43%, transparent 44%),
          linear-gradient(35deg, transparent 55%, rgba(0,0,0,.14) 56% 58%, transparent 59%),
          linear-gradient(80deg, transparent 30%, rgba(255,255,255,.4) 31% 32.5%, transparent 34%),
          linear-gradient(150deg, transparent 62%, rgba(0,0,0,.16) 63% 65%, transparent 66%),
          linear-gradient(10deg, transparent 20%, rgba(0,0,0,.1) 21% 22.5%, transparent 24%);
        animation: creaseIn .4s ease .08s both;
      }
      @keyframes creaseIn { to { opacity: 1; } }
      @keyframes fxCrumple {
        0% {
          translate: 0 0; scale: 1; rotate: 0deg; opacity: 1;
          clip-path: polygon(0% 0%, 25% 0%, 50% 0%, 75% 0%, 100% 0%, 100% 50%, 100% 100%, 75% 100%, 50% 100%, 25% 100%, 0% 100%, 0% 50%);
        }
        18% {
          rotate: -4deg; scale: .94 .9;
          clip-path: polygon(5% 4%, 27% 2%, 49% 7%, 74% 3%, 96% 6%, 93% 48%, 95% 94%, 73% 90%, 51% 96%, 27% 91%, 5% 95%, 7% 52%);
        }
        38% {
          rotate: 6deg; scale: .78 .82; translate: -4px 1px;
          clip-path: polygon(12% 9%, 30% 5%, 50% 14%, 70% 7%, 89% 13%, 84% 49%, 87% 87%, 69% 80%, 50% 90%, 31% 82%, 11% 87%, 15% 51%);
        }
        56% {
          rotate: -8deg; scale: .58; translate: 4px 3px;
          clip-path: polygon(18% 15%, 33% 9%, 50% 20%, 68% 12%, 82% 19%, 77% 50%, 80% 81%, 66% 73%, 50% 84%, 34% 75%, 17% 80%, 22% 51%);
        }
        68% {
          rotate: 11deg; scale: .5; translate: -2px 2px; opacity: 1;
          clip-path: polygon(18% 15%, 33% 9%, 50% 20%, 68% 12%, 82% 19%, 77% 50%, 80% 81%, 66% 73%, 50% 84%, 34% 75%, 17% 80%, 22% 51%);
        }
        76%, 100% { scale: .46; opacity: 0; }
      }
      .fxBall {

      .binBack {

      /* \u2500\u2500\u2500\u2500\u2500 intro & animazioni \u2500\u2500\u2500\u2500\u2500 */
      .splash {
        position: fixed; inset: 0; z-index: 999;

      .theNote {

        width: min(54vw, 210px); height: min(54vw, 210px);

      .pin2 {
        position: absolute; top: 16%; left: 50%; z-index: 3;
        width: 30px; height: 44px; margin: -42px 0 0 -15px;
        transform-origin: 50% 100%;

      .pinHole {
        position: absolute; top: 16%; left: 50%; translate: -50% -50%; z-index: 2;
        width: 8px; height: 5.5px; border-radius: 50%;

        box-shadow: 0 1px 0 rgba(255,255,255,.45), 0 0 0 1.5px rgba(0,0,0,.08); /* carta rialzata attorno */
        animation: holeIn .16s ease .26s both;
      }

        position: absolute; top: 16%; left: 50%; translate: -50% -50%; z-index: 4;

      .sLetter { display: inline-block; opacity: 0; animation: letterIn .38s cubic-bezier(.34,1.56,.64,1) both, letterOut .3s ease both; transition: font-size .9s cubic-bezier(.45,0,.2,1); }
